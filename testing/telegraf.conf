# change this telegraf config to use datadog metrics

[agent]
  interval = "10s"
  flush_interval = "10s"

###############################################################################
# INPUT: Influx Line Protocol listener
###############################################################################
[[inputs.socket_listener]]
service_address = "udp://:8125"
  data_format = "influx"


# Aggregate into a rate window, emits count per interval then resets
[[aggregators.basicstats]]
  period = "10s"          # flush every 10s
 drop_original = true    # don't store raw events, only the aggregate
#  stats = ["sum"]       # just the count; resets each period naturally

###############################################################################
# OUTPUT: Prometheus client endpoint
###############################################################################
[[outputs.prometheus_client]]
  listen = ":9273"
  path = "/metrics"
