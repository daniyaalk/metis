# Percentage of tcp_sendmsg events to capture (0.0–100.0). Supports fractional values.
# Shared by all modules that use the tcp_sendmsg probe (mysql, http).
# e.g. 0.01 = 1 in 10000 events; 10.0 = 1 in 10 events; 100.0 = all events.
tcp_sendmsg_sample_rate = 100.0

[telegraf]
# UDP address of the Telegraf StatsD listener.
address = "127.0.0.1:8125"
protocol = "statsd"

[modules.tcp]
enabled = true
ports = [80, 443]  # omit to capture all ports

[modules.dns]
enabled = true

[modules.mysql]
enabled = true
ports = [3306]

[modules.http]
enabled = false
ports = [80, 8080]
