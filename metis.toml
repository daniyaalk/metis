# Percentage of tcp_sendmsg connections to capture (0.0–100.0). Supports fractional values.
# Sampled once per connection (on its first packet) and reused for every later packet on
# that connection, so e.g. a sampled-in MySQL connection never loses its handshake packet.
# Shared by all modules that use the tcp_sendmsg probe (mysql, http).
# e.g. 0.01 = 1 in 10000 connections; 10.0 = 1 in 10 connections; 100.0 = all connections.
tcp_sendmsg_sample_rate = 100.0

[telegraf]
# UDP address of the Telegraf StatsD listener.
address = "127.0.0.1:8125"
protocol = "statsd"

[modules.tcp]
enabled = true
ports = [80, 443]  # omit to capture all ports

[modules.dns]
enabled = true

[modules.mysql]
enabled = true
ports = [3306]

[modules.http]
enabled = false
ports = [80, 8080]
